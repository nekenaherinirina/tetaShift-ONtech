<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
  <title>ON Tech // ThetaShift HUD</title>
  <style>
    :root {
      --neon-green: #00ff88;
      --neon-cyan: #00e5ff;
      --neon-red: #ff2a5f;
      --border-dim: rgba(0, 229, 255, 0.35);
      --panel-bg: rgba(8, 12, 20, 0.68);
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #05080e;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      overflow: hidden;
    }

    /* Conteneur principal avec image anime assombrie */
    .cockpit {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 45px;
      position: relative;
      /* Superposition du voile sombre (72%) + image anime */
      background-image: 
        linear-gradient(rgba(5, 8, 15, 0.72), rgba(5, 8, 15, 0.78)),
        url('https://img.goodfon.com/wallpaper/big/7/2f/cyborg-girl-long-hair-wavy-hair-face-blue-eyes-mechanical-ar.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Adaptation automatique façon jeu mobile (Mobile Legends) si tenu verticalement */
    @media screen and (orientation: portrait) {
      .cockpit {
        width: 100vh;
        height: 100vw;
        transform: rotate(90deg);
        transform-origin: top left;
        position: absolute;
        top: 0;
        left: 100%;
        padding: 20px 35px;
      }
    }

    /* ==========================================
       GAUCHE : CONTRÔLE DE VITESSE (POUCE GAUCHE)
       ========================================== */
    .speed-module {
      display: flex;
      align-items: center;
      gap: 22px;
      background: var(--panel-bg);
      padding: 18px 24px;
      border-radius: 18px;
      border: 1px solid var(--border-dim);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
    }

    .gauge-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .speed-readout {
      font-family: 'Consolas', monospace;
      font-size: 24px;
      font-weight: 900;
      color: var(--neon-green);
      text-shadow: 0 0 12px rgba(0, 255, 136, 0.6);
    }

    .slider-track {
      position: relative;
      width: 44px;
      height: 175px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    input[type=range].cyber-slider {
      -webkit-appearance: none;
      width: 165px;
      height: 36px;
      background: transparent;
      transform: rotate(-90deg);
      cursor: pointer;
    }

    input[type=range].cyber-slider::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #0072ff, var(--neon-cyan), var(--neon-green));
    }

    input[type=range].cyber-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--neon-cyan);
      margin-top: -9px;
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    .presets {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-mode {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(10, 15, 25, 0.85);
      color: #9ba3af;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }

    .btn-mode strong {
      display: block;
      font-size: 15px;
      color: #fff;
    }

    .btn-mode.active {
      border-color: var(--neon-green);
      background: rgba(0, 255, 136, 0.16);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
      color: var(--neon-green);
    }

    .btn-mode.active strong {
      color: var(--neon-green);
    }

    /* ==========================================
       DROITE : LES 5 BOUTONS (POUCE DROIT)
       ========================================== */
    .dpad-ring {
      width: 265px;
      height: 265px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.1) 0%, rgba(8, 12, 20, 0.78) 75%);
      border: 2px solid var(--border-dim);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .dpad-ring::before {
      content: "";
      position: absolute;
      width: 195px;
      height: 195px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 229, 255, 0.25);
      pointer-events: none;
    }

    /* Boutons 1 à 4 : Flèches directionnelles */
    .svg-arrow {
      position: absolute;
      width: 66px;
      height: 66px;
      fill: rgba(0, 255, 136, 0.28);
      stroke: var(--neon-green);
      stroke-width: 2.5;
      transition: transform 0.08s ease, fill 0.08s ease, filter 0.08s ease;
      pointer-events: none;
    }

    .svg-arrow.up { top: 8px; }
    .svg-arrow.down { bottom: 8px; transform: rotate(180deg); }
    .svg-arrow.left { left: 8px; transform: rotate(-90deg); }
    .svg-arrow.right { right: 8px; transform: rotate(90deg); }

    .svg-arrow.active {
      fill: var(--neon-cyan);
      stroke: #ffffff;
      filter: drop-shadow(0 0 16px var(--neon-cyan));
    }

    .svg-arrow.up.active { transform: scale(1.15); }
    .svg-arrow.down.active { transform: rotate(180deg) scale(1.15); }
    .svg-arrow.left.active { transform: rotate(-90deg) scale(1.15); }
    .svg-arrow.right.active { transform: rotate(90deg) scale(1.15); }

    /* Bouton 5 : Centre ON Tech / STOP */
    .core-btn {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      z-index: 10;
      background: linear-gradient(145deg, #0a192f, #004e92);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.45), inset 0 0 12px rgba(0, 229, 255, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .core-btn .logo-txt {
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 1px;
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .core-btn .sub-txt {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--neon-cyan);
      margin-top: 4px;
    }

    .core-btn.stopped, .core-btn:active {
      background: linear-gradient(145deg, #4a0010, #ff2a5f);
      border-color: #ffffff;
      box-shadow: 0 0 30px var(--neon-red);
      transform: scale(0.93);
    }

    .core-btn.stopped .sub-txt {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="cockpit" id="cockpit">
    <!-- GAUCHE : Contrôle de vitesse -->
    <div class="speed-module">
      <div class="gauge-box">
        <div class="speed-readout" id="speed-display">65%</div>
        <div class="slider-track">
          <input type="range" min="15" max="100" value="65" class="cyber-slider" id="speed-slider">
        </div>
      </div>
      <div class="presets">
        <button class="btn-mode" data-speed="30"><strong>30%</strong>PRÉCISION</button>
        <button class="btn-mode active" data-speed="65"><strong>65%</strong>COURSE</button>
        <button class="btn-mode" data-speed="100"><strong>100%</strong>TURBO SABLE</button>
      </div>
    </div>

    <!-- DROITE : Les 5 boutons (Haut, Bas, Gauche, Droite + Centre STOP) -->
    <div class="dpad-ring" id="dpad">
      <svg class="svg-arrow up" id="arr-up" viewBox="0 0 100 100">
        <polygon points="50,12 88,78 50,62 12,78" />
      </svg>
      <svg class="svg-arrow down" id="arr-down" viewBox="0 0 100 100">
        <polygon points="50,12 88,78 50,62 12,78" />
      </svg>
      <svg class="svg-arrow left" id="arr-left" viewBox="0 0 100 100">
        <polygon points="50,12 88,78 50,62 12,78" />
      </svg>
      <svg class="svg-arrow right" id="arr-right" viewBox="0 0 100 100">
        <polygon points="50,12 88,78 50,62 12,78" />
      </svg>

      <div class="core-btn" id="stop-btn">
        <div class="logo-txt">ON<br>Tech</div>
        <div class="sub-txt">STOP</div>
      </div>
    </div>
  </div>

  <script>
    let ws;
    const slider = document.getElementById('speed-slider');
    const speedDisplay = document.getElementById('speed-display');
    const dpad = document.getElementById('dpad');
    const stopBtn = document.getElementById('stop-btn');
    const presetBtns = document.querySelectorAll('.btn-mode');

    const arrUp = document.getElementById('arr-up');
    const arrDown = document.getElementById('arr-down');
    const arrLeft = document.getElementById('arr-left');
    const arrRight = document.getElementById('arr-right');

    function lockLandscapeMode() {
      if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }

    document.body.addEventListener('touchstart', lockLandscapeMode, { once: true });

    function connectWS() {
      if (!window.location.hostname || window.location.hostname.includes('github.io')) return;

      try {
        ws = new WebSocket('ws://' + window.location.hostname + '/ws');
        ws.onclose = () => setTimeout(connectWS, 1000);
      } catch (e) {
        console.warn('WebSocket connection failed:', e);
      }
    }

    connectWS();

    let speed = 65;
    let dirX = 0;
    let dirY = 0;
    let lastSend = 0;
    let isMouseDown = false;

    slider.addEventListener('input', (e) => {
      speed = parseInt(e.target.value, 10);
      speedDisplay.textContent = `${speed}%`;
      presetBtns.forEach((b) => b.classList.remove('active'));
      sendState(true);
    });

    presetBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        speed = parseInt(btn.dataset.speed, 10);
        slider.value = speed;
        speedDisplay.textContent = `${speed}%`;
        presetBtns.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');

        if (navigator.vibrate) navigator.vibrate(25);
        sendState(true);
      });
    });

    function sendState(force = false) {
      const now = Date.now();
      if (!force && now - lastSend < 30) return;
      lastSend = now;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ x: dirX, y: dirY, s: speed }));
      }
    }

    function updateVisuals(x, y) {
      arrUp.classList.toggle('active', y > 25);
      arrDown.classList.toggle('active', y < -25);
      arrRight.classList.toggle('active', x > 25);
      arrLeft.classList.toggle('active', x < -25);
    }

    function processPoint(clientX, clientY) {
      const rect = dpad.getBoundingClientRect();
      const isPortrait = window.innerHeight > window.innerWidth;
      let dx;
      let dy;

      if (isPortrait) {
        dx = clientY - (rect.top + rect.height / 2);
        dy = -(clientX - (rect.left + rect.width / 2));
      } else {
        dx = clientX - (rect.left + rect.width / 2);
        dy = clientY - (rect.top + rect.height / 2);
      }

      const maxR = (isPortrait ? rect.height : rect.width) / 2;

      if (Math.hypot(dx, dy) < 42) {
        dirX = 0;
        dirY = 0;
      } else {
        dirX = Math.max(-100, Math.min(100, Math.round((dx / maxR) * 100)));
        dirY = Math.max(-100, Math.min(100, Math.round(-(dy / maxR) * 100)));
      }

      updateVisuals(dirX, dirY);
      sendState();
    }

    function resetDpad() {
      dirX = 0;
      dirY = 0;
      updateVisuals(0, 0);
      sendState(true);
    }

    dpad.addEventListener('touchstart', (e) => {
      if (stopBtn.contains(e.target)) return;
      e.preventDefault();
      if (navigator.vibrate) navigator.vibrate(15);

      const touch = Array.from(e.touches).find((t) => dpad.contains(t.target));
      if (touch) processPoint(touch.clientX, touch.clientY);
    });

    dpad.addEventListener('touchmove', (e) => {
      if (stopBtn.contains(e.target)) return;
      e.preventDefault();

      const touch = Array.from(e.touches).find((t) => dpad.contains(t.target));
      if (touch) processPoint(touch.clientX, touch.clientY);
    });

    dpad.addEventListener('touchend', (e) => {
      e.preventDefault();
      resetDpad();
    });

    dpad.addEventListener('mousedown', (e) => {
      if (stopBtn.contains(e.target)) return;
      isMouseDown = true;
      processPoint(e.clientX, e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      processPoint(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', () => {
      if (isMouseDown) {
        isMouseDown = false;
        resetDpad();
      }
    });

    function triggerStop(e) {
      e.stopPropagation();
      isMouseDown = false;
      dirX = 0;
      dirY = 0;
      updateVisuals(0, 0);
      stopBtn.classList.add('stopped');

      if (navigator.vibrate) navigator.vibrate(150);
      setTimeout(() => stopBtn.classList.remove('stopped'), 350);

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ x: 0, y: 0, s: 0, stop: 1 }));
      }
    }

    stopBtn.addEventListener('touchstart', triggerStop);
    stopBtn.addEventListener('mousedown', triggerStop);
  </script>
